# Render Blueprint: free web service + external MySQL (data lives in MySQL, so no disk is needed).
services:
  - type: web
    name: homehaat
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATA_PROVIDER
        value: mysql
      - key: DEMO_MODE
        value: "true"
      - key: PAYMENT_PROVIDER   # dummy | razorpay (switch to razorpay after adding the keys below)
        value: dummy
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SHOW_DEMO_LOGINS
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_URL        # paste your database URL in the Render dashboard
        sync: false
      - key: BASE_URL         # e.g. https://homehaat.onrender.com (set after first deploy)
        sync: false
