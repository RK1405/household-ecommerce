<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checkout | {store}</title>
  <meta name="description" content="Secure checkout">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/store.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><a href="/cart.html">Cart</a></li><li aria-current="page">Checkout</li></ol></nav>
      <h1 style="font-size:var(--fs-2xl)">Checkout</h1>
      <div class="steps" aria-label="Checkout progress"><span class="st done"><span class="n">✓</span>Cart</span><span class="sep"></span><span class="st active"><span class="n">2</span>Address & delivery</span><span class="sep"></span><span class="st"><span class="n">3</span>Payment</span><span class="sep"></span><span class="st"><span class="n">4</span>Done</span></div>
      <div id="checkout-root"><div class="skeleton" style="height:320px"></div></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/pages/checkout.js"></script>
</body>
</html>
