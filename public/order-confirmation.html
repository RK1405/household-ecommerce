<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order confirmed | {store}</title>
  <meta name="description" content="Your order is confirmed">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/store.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <div class="container" style="max-width:820px">
      <div class="steps" aria-label="Checkout progress" style="justify-content:center"><span class="st done"><span class="n">✓</span>Cart</span><span class="sep"></span><span class="st done"><span class="n">✓</span>Address</span><span class="sep"></span><span class="st done"><span class="n">✓</span>Payment</span><span class="sep"></span><span class="st active"><span class="n">4</span>Done</span></div>
      <div id="conf-root"><div class="skeleton" style="height:300px"></div></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/pages/order-confirmation.js"></script>
</body>
</html>
