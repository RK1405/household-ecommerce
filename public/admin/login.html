<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/store.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <main class="login-shell" id="main">
    <div class="card card-pad" style="width:min(440px,100%)">
      <div class="row" style="gap:10px;margin-bottom:12px"><img src="/images/brand/logo.svg" alt="" width="40" height="40"><div><strong id="store-name" style="font-size:1.2rem">Store</strong><div class="xs muted">Admin panel</div></div></div>
      <h1 style="font-size:1.5rem">Sign in to admin</h1>
      <div id="demo"></div>
      <form id="login" novalidate>
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <div class="alert alert-danger hidden" id="err" role="alert"></div>
        <button class="btn btn-block btn-lg">Sign in</button>
      </form>
      <p class="small mt-4 mb-0"><a href="/">← Back to store</a></p>
    </div>
  </main>
  <script type="module" src="/admin/js/login.js"></script>
</body>
</html>
