<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales reports · Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/store.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div id="admin-shell">
    <section class="panel"><form class="filters-bar" id="f" style="margin:0">
      <label class="small">From <input type="date" class="input" name="from" id="from"></label><label class="small">To <input type="date" class="input" name="to" id="to"></label>
      <div class="chips"><button type="button" class="chip" data-r="7">7 days</button><button type="button" class="chip" data-r="30">30 days</button><button type="button" class="chip" data-r="90">90 days</button><button type="button" class="chip" data-r="mtd">This month</button></div>
      <select class="input" name="group" id="group" aria-label="Group by"><option value="day">By day</option><option value="week">By week</option><option value="month">By month</option></select>
      <button class="btn btn-sm">Apply</button>
      <span style="flex:1"></span><span class="small muted">Export CSV:</span><a class="btn btn-sm btn-light" data-csv="series">Revenue</a><a class="btn btn-sm btn-light" data-csv="products">Products</a><a class="btn btn-sm btn-light" data-csv="categories">Categories</a><a class="btn btn-sm btn-light" data-csv="payments">Payment methods</a>
    </form></section>
    <section class="kpis mt-4" id="kpis"></section>
    <section class="panel mt-4"><h2>Revenue over time</h2><div class="chart-box"><canvas id="c-series" role="img" aria-label="Revenue over time"></canvas></div></section>
    <div class="a-grid half mt-4">
      <section class="panel"><h2>Revenue by category</h2><div class="chart-box"><canvas id="c-cat" role="img" aria-label="Revenue by category"></canvas></div></section>
      <section class="panel"><h2>COD vs online</h2><div class="chart-box"><canvas id="c-pay" role="img" aria-label="COD vs online revenue"></canvas></div><div class="table-wrap mt-4"><table class="table"><thead><tr><th>Method</th><th class="num">Orders</th><th class="num">Revenue</th></tr></thead><tbody id="t-method"></tbody></table></div></section>
    </div>
    <div class="a-grid half mt-4">
      <section class="panel"><h2>Top products</h2><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Revenue</th></tr></thead><tbody id="t-top"></tbody></table></div></section>
      <section class="panel"><h2>Top states</h2><div class="chart-box"><canvas id="c-state" role="img" aria-label="Revenue by state"></canvas></div></section>
    </div>
  </div>
  <script type="module" src="/admin/js/reports.js"></script>
</body>
</html>
