<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email settings · Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/store.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div id="admin-shell">
    <div class="alert alert-info" id="mode"></div>
    <div class="a-grid half">
      <section class="panel"><h2>SMTP configuration</h2><form id="smtp">
        <div class="form-grid cols-2"><div class="field span-2"><label for="host">SMTP host</label><input class="input" id="host" name="host" placeholder="smtp.yourprovider.com"></div>
        <div class="field"><label for="port">Port</label><input class="input" id="port" name="port" type="number"></div><div class="field"><label class="check" style="margin-top:28px"><input type="checkbox" name="secure" id="secure"> Use SSL/TLS (port 465)</label></div>
        <div class="field"><label for="user">Username</label><input class="input" id="user" name="user" autocomplete="off"></div><div class="field"><label for="pass">Password</label><input class="input" id="pass" name="pass" type="password" autocomplete="new-password"></div>
        <div class="field span-2"><label for="from">From address</label><input class="input" id="from" name="from" placeholder="Store &lt;no-reply@store.in&gt;"></div>
        <div class="field span-2"><label for="admin">Admin notification email</label><input class="input" id="admin" name="adminEmail" type="email"></div>
        <div class="field span-2"><label class="check"><input type="checkbox" id="demo" name="demoMode"> Demo mode — never send; write emails to the outbox</label><span class="field-hint">DEMO_MODE=true in .env always forces the outbox.</span></div></div>
        <button class="btn">Save SMTP settings</button></form>
        <hr class="divider"><h2>Send test email</h2><form id="test" class="row"><label for="to" class="sr-only">Recipient</label><input class="input" id="to" name="to" type="email" placeholder="you@example.com" style="flex:1"><button class="btn btn-outline">Send test</button></form><p class="small mt-4" id="test-result" role="status"></p></section>
      <section class="panel"><h2>Automatic emails</h2><p class="small muted">Turn individual emails on/off and preview the branded templates.</p><ul class="list-plain" id="types"></ul></section>
    </div>
    <section class="panel mt-4"><div class="panel-head"><h2>Outbox</h2><button class="btn btn-sm btn-light" id="refresh">↻ Refresh</button></div><p class="small muted">Every email generated by the store (files in <span class="code">storage/outbox</span>).</p>
      <div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>To</th><th>Subject</th><th>Status</th><th></th></tr></thead><tbody id="outbox"></tbody></table></div></section>
  </div>
  <script type="module" src="/admin/js/email-settings.js"></script>
</body>
</html>
