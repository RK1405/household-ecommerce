<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reviews · Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/store.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div id="admin-shell">
    <div class="mock-banner">🧪 <strong>Mock data.</strong> Customer Review Management uses the <span class="code">ReviewsService</span> mock adapter (in-memory, resets on restart). Connect MySQL or Salesforce later — see <span class="code">src/services/reviews/</span>.</div>
    <section class="panel"><div class="panel-head"><h2>Product reviews</h2><span class="small muted" id="count"></span></div>
      <div class="filters-bar"><input type="search" class="input" id="q" placeholder="Search product, reviewer, text" aria-label="Search reviews"><select class="input" id="st" aria-label="Status"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><select class="input" id="rt" aria-label="Rating"><option value="">All ratings</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
      <div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Rating</th><th>Review</th><th>By</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </div>
  <script type="module" src="/admin/js/reviews.js"></script>
</body>
</html>
